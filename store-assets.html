<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mark App Store Preview Set</title>
    <link rel="stylesheet" href="store-assets.css" />
  </head>
  <body>
    <header>
      <img src="./public/icon/mark.svg" alt="Mark" />
      <div>
        <p>APP STORE ASSETS</p>
        <h1>Mark 1.0 preview set</h1>
        <span>Final-size artwork for iPhone, iPad, Mac, and subscription review.</span>
      </div>
    </header>

    <main>
      <section>
        <div class="section-heading"><h2>iPhone</h2><span>1284 × 2778</span></div>
        <div class="grid phone-grid">
          <figure><img src="../app-store-assets/1.0/iphone/1-highlight.jpg?v=4" alt="Real Mark highlighter on iPhone" /><figcaption>01 · Highlight</figcaption></figure>
          <figure><img src="../app-store-assets/1.0/iphone/2-outline.jpg?v=4" alt="Real Mark outline tool on iPhone" /><figcaption>02 · Outline</figcaption></figure>
          <figure><img src="../app-store-assets/1.0/iphone/3-draw.jpg?v=4" alt="Real Mark freehand tool on iPhone" /><figcaption>03 · Draw</figcaption></figure>
          <figure><img src="../app-store-assets/1.0/iphone/4-note.jpg?v=4" alt="Real Mark sticky note on iPhone" /><figcaption>04 · Note</figcaption></figure>
          <figure><img src="../app-store-assets/1.0/iphone/5-library.jpg?v=5" alt="Real Mark library on iPhone" /><figcaption>05 · Library</figcaption></figure>
        </div>
      </section>

      <section>
        <div class="section-heading"><h2>iPad</h2><span>2064 × 2752</span></div>
        <div class="grid tablet-grid">
          <figure><img src="../app-store-assets/1.0/ipad/1-highlight.jpg?v=4" alt="Real Mark highlighter on iPad" /><figcaption>01 · Highlight</figcaption></figure>
          <figure><img src="../app-store-assets/1.0/ipad/2-outline.jpg?v=4" alt="Real Mark outline tool on iPad" /><figcaption>02 · Outline</figcaption></figure>
          <figure><img src="../app-store-assets/1.0/ipad/3-draw.jpg?v=4" alt="Real Mark freehand tool on iPad" /><figcaption>03 · Draw</figcaption></figure>
          <figure><img src="../app-store-assets/1.0/ipad/4-note.jpg?v=4" alt="Real Mark sticky note on iPad" /><figcaption>04 · Note</figcaption></figure>
          <figure><img src="../app-store-assets/1.0/ipad/5-library.jpg?v=5" alt="Real Mark library on iPad" /><figcaption>05 · Library</figcaption></figure>
        </div>
      </section>

      <section>
        <div class="section-heading"><h2>Mac</h2><span>2880 × 1800</span></div>
        <div class="grid mac-grid">
          <figure><img src="../app-store-assets/1.0/mac/1-highlight.jpg?v=4" alt="Real Mark highlighter on Mac" /><figcaption>01 · Highlight</figcaption></figure>
          <figure><img src="../app-store-assets/1.0/mac/2-outline.jpg?v=4" alt="Real Mark outline tool on Mac" /><figcaption>02 · Outline</figcaption></figure>
          <figure><img src="../app-store-assets/1.0/mac/3-draw.jpg?v=4" alt="Real Mark freehand tool on Mac" /><figcaption>03 · Draw</figcaption></figure>
          <figure><img src="../app-store-assets/1.0/mac/4-note.jpg?v=4" alt="Real Mark sticky note on Mac" /><figcaption>04 · Note</figcaption></figure>
          <figure><img src="../app-store-assets/1.0/mac/5-library.jpg?v=5" alt="Real Mark library on Mac" /><figcaption>05 · Library</figcaption></figure>
        </div>
      </section>

      <section>
        <div class="section-heading"><h2>Subscription review</h2><span>1284 × 2778</span></div>
        <div class="grid review-grid">
          <figure><img src="../app-store-assets/1.0/subscription-review/mark-yearly-purchase-screen.jpg?v=5" alt="Mark monthly and yearly subscription choices" /><figcaption>30 days free without signup · Then $2.99/month or $19.99/year (US)</figcaption></figure>
        </div>
      </section>
    </main>
  </body>
</html>
