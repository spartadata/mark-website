<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="Playful wordmark directions for Mark, the Safari annotation workspace." />
    <title>Mark Wordmark Playground</title>
    <link rel="icon" href="./public/icon/32.png" sizes="32x32" />
    <link rel="stylesheet" href="./wordmarks.css?v=10" />
  </head>
  <body>
    <header class="lab-header">
      <a class="lab-brand" href="./?wordmark=4" aria-label="Back to the Mark website">
        <img src="./public/icon/mark.svg" alt="" width="34" height="34" />
        <span>Mark</span>
      </a>
      <a class="back-link" href="./?wordmark=4">Back to website</a>
    </header>

    <main>
      <section class="intro">
        <p class="eyebrow">Wordmark playground</p>
        <h1>A little more play<br />in every mark.</h1>
        <p>Your favorite pieces, assembled into one lively direction, followed by the six original studies.</p>
      </section>

      <section class="concept-grid" aria-label="Mark wordmark directions">
        <button class="concept concept-custom is-selected is-replaying" type="button" aria-pressed="true" data-concept data-mix>
          <span class="concept-head"><b>NEW</b><span>The Mark Mix</span><i data-selection>Replay</i></span>
          <span class="concept-stage">
            <span class="mark-build" role="img" aria-label="Mark">
              <span class="mark-m">M<i class="marker-cap"></i></span>
              <span class="mark-a"><i></i></span>
              <span class="mark-r">r<i></i></span>
              <span class="mark-k"><b>k</b><i></i></span>
            </span>
          </span>
          <span class="concept-foot">Modular · squishy · handmade · play it again</span>
        </button>

        <button class="concept concept-toybox" type="button" aria-pressed="false" data-concept>
          <span class="concept-head"><b>01</b><span>Toybox</span><i data-selection>Choose</i></span>
          <span class="concept-stage">
            <span class="mark-build" role="img" aria-label="Mark">

        <button class="concept concept-soft" type="button" aria-pressed="false" data-concept>
